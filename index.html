<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: la app ocupa también la zona de la muesca; interactive-widget: el teclado encoge la vista en lugar de taparla -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#F8F7FC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171522" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="ManaMatch: encuentra rivales de Magic, Pokémon y One Piece cerca de ti, mira sus mazos y quedad para jugar en vuestra tienda." />
    <meta name="format-detection" content="telephone=no" />

    <!-- Instalación como app (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ManaMatch" />
    <meta name="application-name" content="ManaMatch" />

    <title>ManaMatch · Rivales de TCG cerca de ti</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>ManaMatch necesita JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
